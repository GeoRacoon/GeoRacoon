name: REUSE Compliance Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  reuse-compliance-check:
    runs-on: ubuntu-latest
    container:
      image: python:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install REUSE
        run: python -m pip install --disable-pip-version-check reuse
      - name: REUSE Compliance Check
        shell: sh
        run: |
          set +e
          reuse lint --json > reuse-report.json
          reuse_status=$?

          REUSE_STATUS="$reuse_status" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          report = json.loads(Path("reuse-report.json").read_text())
          non_compliant = report["non_compliant"]

          ignored_extensions = {".json"}
          missing_metadata = set(
              non_compliant["missing_copyright_info"]
              + non_compliant["missing_licensing_info"]
          )
          unexpected_missing_metadata = sorted(
              path
              for path in missing_metadata
              if Path(path).suffix.lower() not in ignored_extensions
          )

          if unexpected_missing_metadata:
              print("REUSE metadata is missing from non-ignored files:")
              for path in unexpected_missing_metadata:
                  print(f" - {path}")

          if missing_metadata and not unexpected_missing_metadata:
              print("Only ignored file types lack REUSE metadata:")
              for path in sorted(missing_metadata):
                  print(f" - {path}")

          other_errors = any(
              non_compliant[key]
              for key in (
                  "bad_licenses",
                  "deprecated_licenses",
                  "licenses_without_extension",
                  "missing_licenses",
                  "unused_licenses",
                  "read_errors",
                  "invalid_spdx_expressions",
              )
          )

          if unexpected_missing_metadata or other_errors:
              sys.exit(1)

          if int(os.environ["REUSE_STATUS"]) != 0:
              print("REUSE reported only ignored file-type metadata findings.")
          PY
